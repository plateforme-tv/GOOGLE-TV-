<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GOOGLE-TV</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #172033;
      min-height: 100vh;
    }

    header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid #e5e7eb;
      background: #ffffff;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #1255d6;
    }

    .logo span {
      color: #f2c300;
    }

    .secure {
      font-size: 12px;
      color: #667085;
    }

    main {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 28px;
    }

    .welcome h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: #667085;
      font-size: 14px;
      line-height: 1.5;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.05);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #f2f4f7;
      color: #667085;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.active {
      background: #1255d6;
      color: #ffffff;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #1255d6;
    }

    .button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1255d6;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    .button:hover {
      opacity: 0.92;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #f2f4f7;
      font-size: 14px;
      line-height: 1.4;
      display: none;
    }

    footer {
      text-align: center;
      padding: 25px 20px;
      color: #98a2b3;
      font-size: 12px;
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>

<script>
  const SUPABASE_URL = "https://zfppekhlwxewkxwwlsix.supabase.co";
  const SUPABASE_KEY = "sb_publishable_r1fQtVmm5-BWltdyo60fXw_hyKe1NCL";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
</script><body>

  <header>
    <div class="logo">GOOGLE<span>-TV</span></div>
    <div class="secure">Espace sécurisé</div>
  </header>

  <main>

    <div class="welcome">
      <h1>Bienvenue</h1>
      <p>
        Connectez-vous ou créez votre compte pour accéder à votre espace.
      </p>
    </div>

    <div class="card">

      <div class="tabs">
        <button class="tab active" onclick="showForm('login')">
          Connexion
        </button>

        <button class="tab" onclick="showForm('register')">
          Inscription
        </button>
      </div>

      <!-- CONNEXION -->

      <form id="login" class="form active">

        <div class="field">
          <label for="loginEmail">Adresse e-mail</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="exemple@email.com"
            required
          >
        </div>

        <div class="field">
          <label for="loginPassword">Mot de passe</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="Votre mot de passe"
            required
          >
        </div>

        <button type="submit" class="button">
          Se connecter
        </button>

      </form>

      <!-- INSCRIPTION -->

      <form id="register" class="form">

        <div class="field">
          <label for="registerName">Nom</label>
          <input
            type="text"
            id="registerName"
            placeholder="Votre nom"
            required
          >
        </div>

        <div class="field">
          <label for="registerPhone">Téléphone</label>
          <input
            type="tel"
            id="registerPhone"
            placeholder="+229..."
            required
          >
        </div>

        <div class="field">
          <label for="registerEmail">Adresse e-mail</label>
          <input
            type="email"
            id="registerEmail"
            placeholder="exemple@email.com"
            required
          >
        </div>

        <div class="field">
          <label for="registerPassword">Mot de passe</label>
          <input
            type="password"
            id="registerPassword"
            placeholder="Choisissez un mot de passe"
            required
          >
        </div>

        <button type="submit" class="button">
          Créer mon compte
        </button>

      </form>

      <div id="message" class="message"></div>

    </div>

  </main>

  <footer>
    © 2026 GOOGLE-TV
  </footer>

  <script>
    function showForm(formName) {

      document.querySelectorAll(".form").forEach(function(form) {
        form.classList.remove("active");
      });

      document.querySelectorAll(".tab").forEach(function(tab) {
        tab.classList.remove("active");
      });

      document.getElementById(formName).classList.add("active");

      if (formName === "login") {
        document.querySelectorAll(".tab")[0].classList.add("active");
      } else {
        document.querySelectorAll(".tab")[1].classList.add("active");
      }
    }

    document.getElementById("login").addEventListener("submit", async function(event) {
  event.preventDefault();

  const message = document.getElementById("message");

  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  message.style.display = "block";

  if (error) {
    message.textContent = "Erreur : " + error.message;
    return;
  }

  message.textContent = "Connexion réussie !";
});


document.getElementById("register").addEventListener("submit", async function(event) {
  event.preventDefault();

  const message = document.getElementById("message");

  const nom = document.getElementById("registerName").value;
  const telephone = document.getElementById("registerPhone").value;
  const email = document.getElementById("registerEmail").value;
  const password = document.getElementById("registerPassword").value;

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      data: {
        nom: nom,
        telephone: telephone
      }
    }
  });

  message.style.display = "block";

  if (error) {
    message.textContent = "Erreur : " + error.message;
    return;
  }

  message.textContent =
    "Compte créé avec succès ! Votre compte est en attente d'activation.";
});
  </script>

</body>
  </html>
